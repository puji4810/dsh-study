# StudyOS bundles its TikZ renderer as a second row, so a single
# `dsh plugin --profile web add @puji4810/dsh-study` activates both the
# StudyOS panel and TikZ fence rendering. `@puji4810/dsh-tikz` stays a
# regular dependency of this package; the profile's hoisted node_modules
# makes it resolvable from this row's `name` without a separate layer.
- insert:
    - id: studyos
      name: '@puji4810/dsh-study'

    - id: tikz
      name: '@puji4810/dsh-tikz'

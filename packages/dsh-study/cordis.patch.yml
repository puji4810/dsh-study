# StudyOS bundles its diagram renderers as extra rows, so a single
# `dsh plugin --profile web add @puji4810/dsh-study` activates the StudyOS
# panel plus both TikZ and Mermaid fence rendering. Both packages stay
# regular dependencies of this package; the profile's hoisted node_modules
# makes them resolvable from these rows' `name` without a separate layer.
- insert:
    - id: studyos
      name: '@puji4810/dsh-study'

    - id: tikz
      name: '@puji4810/dsh-tikz'

    - id: mermaid
      name: '@puji4810/dsh-mermaid'
